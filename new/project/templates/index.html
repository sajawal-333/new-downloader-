<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Downloader</title>
    <!-- Modern Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS for grid -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    
    <!-- Animated background elements -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="container d-flex align-items-center justify-content-center min-vh-100 position-relative z-1 py-5">
        <div class="glass-card p-5 w-100 shadow-lg text-center" style="max-width: 600px;">
            
            <div class="mb-5">
                <div class="logo-icon mx-auto mb-3">
                    <i class="fa-solid fa-cloud-arrow-down text-white fa-2x"></i>
                </div>
                <h1 class="fw-bold mb-2 title-gradient">Video Downloader</h1>
                <p class="text-secondary fw-medium">Download high-quality content instantly.</p>
            </div>

            <!-- Download Form -->
            <form id="downloadForm">
                <div class="input-group mb-4 url-input-group">
                    <span class="input-group-text bg-transparent border-0 ps-4 pe-2">
                        <i class="fa-solid fa-link text-muted"></i>
                    </span>
                    <input type="url" class="form-control form-control-lg border-0 bg-transparent ps-2 fw-medium" 
                           id="url" name="url" placeholder="Paste video link here..." required>
                </div>
                
                <div class="row g-3 mb-5 text-start">
                    <div class="col-6">
                        <label for="format" class="form-label ms-1 text-muted fw-bold text-uppercase small tracking-wide">Format</label>
                        <select class="form-select form-select-lg custom-select fw-medium" id="format" name="format">
                            <option value="mp4" selected>MP4 Video</option>
                            <option value="mp3">MP3 Audio</option>
                        </select>
                    </div>
                    <div class="col-6">
                        <label for="quality" class="form-label ms-1 text-muted fw-bold text-uppercase small tracking-wide">Quality</label>
                        <select class="form-select form-select-lg custom-select fw-medium" id="quality" name="quality">
                            <option value="best" selected>Best Match</option>
                            <option value="2160p">4K (2160p)</option>
                            <option value="1080p">HD (1080p)</option>
                            <option value="720p">SD (720p)</option>
                            <option value="360p">Low (360p)</option>
                        </select>
                    </div>
                </div>
                
                <button type="submit" id="submitBtn" class="btn btn-primary btn-lg w-100 rounded-pill py-3 fw-bold download-btn position-relative overflow-hidden shadow">
                    <span class="btn-text">Start Download</span>
                    <i class="fa-solid fa-arrow-right ms-2 btn-icon"></i>
                </button>
            </form>
            
            <!-- Loading UI overlay -->
            <div id="loadingUI" class="mt-4 d-none fade-in">
                <div class="custom-spinner mx-auto mb-3"></div>
                <h6 class="fw-bold text-primary mb-1">Processing Request...</h6>
                <p class="text-secondary small mb-0" id="loadingText">Grabbing highest quality stream, do not close.</p>
            </div>

            <!-- Result container -->
            <div id="resultContainer" class="mt-4 d-none fade-in text-start p-4 rounded-4 result-box">
                <div class="d-flex align-items-center mb-3">
                    <div class="success-icon rounded-circle bg-success bg-opacity-10 d-flex align-items-center justify-content-center me-3" style="width: 48px; height: 48px;">
                        <i class="fa-solid fa-check text-success fa-xl"></i>
                    </div>
                    <div>
                        <h6 class="fw-bold mb-1 text-dark">Ready to Save!</h6>
                        <p class="mb-0 text-secondary fw-semibold text-truncate" id="resultTitle" style="max-width:350px;">Video Title Here</p>
                    </div>
                </div>
                <a id="downloadLink" href="#" class="btn btn-success fw-bold rounded-pill w-100 py-3 shadow-sm">
                    <i class="fa-solid fa-hard-drive me-2"></i> Save to Device
                </a>
            </div>
            
            <!-- Error message container -->
            <div id="errorContainer" class="mt-4 d-none fade-in alert alert-danger border-0 rounded-4 text-start d-flex align-items-start shadow-sm">
                <i class="fa-solid fa-triangle-exclamation mt-1 me-3"></i>
                <div>
                    <h6 class="fw-bold mb-1">Download Failed</h6>
                    <span id="errorText" class="small fw-medium"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('downloadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const url = document.getElementById('url').value.trim();
            const format = document.getElementById('format').value;
            const quality = document.getElementById('quality').value;
            
            if(!url) return;
            
            const submitBtn = document.getElementById('submitBtn');
            const loadingUI = document.getElementById('loadingUI');
            const resultContainer = document.getElementById('resultContainer');
            const errorContainer = document.getElementById('errorContainer');
            
            submitBtn.classList.add('d-none');
            loadingUI.classList.remove('d-none');
            resultContainer.classList.add('d-none');
            errorContainer.classList.add('d-none');
            
            try {
                const response = await fetch('/start_download', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({url, format, quality})
                });
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    pollStatus(data.task_id);
                } else {
                    showError(data.message);
                }
            } catch (error) {
                showError("Network error occurred. The server might be unreachable.");
            }
        });
        
        async function pollStatus(taskId) {
            try {
                const response = await fetch(`/status/${taskId}`);
                const data = await response.json();
                
                if (data.status === 'downloading') {
                    // Change text randomly occasionally for feedback
                    const dots = document.getElementById('loadingText').innerText.match(/\./g)?.length || 0;
                    document.getElementById('loadingText').innerText = "Processing video" + ".".repeat((dots % 3) + 1);
                    
                    setTimeout(() => pollStatus(taskId), 2500);
                } else if (data.status === 'success') {
                    showSuccess(data);
                } else {
                    showError(data.message || 'Error processing the video');
                }
            } catch (error) {
                showError("Lost connection to the downloader server.");
            }
        }
        
        function showSuccess(data) {
            document.getElementById('loadingUI').classList.add('d-none');
            document.getElementById('submitBtn').classList.remove('d-none');
            document.getElementById('url').value = ''; // Reset input
            
            const resultContainer = document.getElementById('resultContainer');
            resultContainer.classList.remove('d-none');
            
            document.getElementById('resultTitle').textContent = data.title;
            document.getElementById('downloadLink').href = `/download/${encodeURIComponent(data.filename)}`;
        }
        
        function showError(message) {
            document.getElementById('loadingUI').classList.add('d-none');
            document.getElementById('submitBtn').classList.remove('d-none');
            
            const errorContainer = document.getElementById('errorContainer');
            errorContainer.classList.remove('d-none');
            document.getElementById('errorText').textContent = message;
        }
    </script>
</body>
</html>
